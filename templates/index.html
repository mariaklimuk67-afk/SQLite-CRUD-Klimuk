<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Моя бібліотека</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 3px; }
        .btn-add { background-color: #4CAF50; }
        .btn-edit { background-color: #2196F3; }
        .btn-delete { background-color: #f44336; }
    </style>
</head>
<body>
    <h1>Список книг</h1>
    <a href="/add" class="btn btn-add">Додати книгу</a>
    <br><br>
    <table>
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>Автор</th>
            <th>Рік</th>
            <th>Жанр</th>
            <th>Дії</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book[0] }}</td>
            <td>{{ book[1] }}</td>
            <td>{{ book[2] }}</td>
            <td>{{ book[3] }}</td>
            <td>{{ book[4] }}</td>
            <td>
                <a href="/edit/{{ book[0] }}" class="btn btn-edit">Редагувати</a>
                <a href="/delete/{{ book[0] }}" class="btn btn-delete" onclick="return confirm('Ви впевнені?')">Видалити</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
