<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Додати книгу</title>
</head>
<body>
    <h1>Додати нову книгу</h1>
    <form method="POST">
        Назва: <input type="text" name="title" required><br><br>
        Автор: <input type="text" name="author" required><br><br>
        Рік: <input type="number" name="year"><br><br>
        Жанр: <input type="text" name="genre"><br><br>
        <button type="submit">Зберегти</button>
        <a href="/">Скасувати</a>
    </form>
</body>
</html>
